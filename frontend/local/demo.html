<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandastic: two phones</title>
<style>
  :root { --leaf: #305a4c; --soil: #29382f; --soil-muted: #778077; --mist: #fafbf8; --line: #e4e8df; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--mist); color: var(--soil); font: 16px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; }
  main { flex: 1; display: flex; gap: 40px; justify-content: center; align-items: center; padding: 16px; flex-wrap: wrap; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { text-align: center; font-weight: 600; }
  figcaption small { display: block; font-weight: 400; color: var(--soil-muted); }
  .frame { width: calc(390px * var(--scale)); height: calc(844px * var(--scale)); }
  .device { width: 414px; height: 868px; padding: 12px; border-radius: 48px; background: #1c211e;
    box-shadow: 0 10px 30px rgb(0 0 0 / .18); transform: scale(var(--scale)); transform-origin: top left;
    margin: calc(-12px * var(--scale)); }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 36px; background: #fff; display: block; }
</style>
</head>
<body>
<main>
  <figure>
    <div class="frame"><div class="device"><iframe id="basic" title="Basic phone" allow="camera; microphone; autoplay"></iframe></div></div>
    <figcaption>Basic phone (Noor)<small>number <span data-port="basic"></span></small></figcaption>
  </figure>
  <figure>
    <div class="frame"><div class="device"><iframe id="capable" title="Capable helper phone" allow="camera; microphone; autoplay"></iframe></div></div>
    <figcaption>Helper phone (capable)<small>number <span data-port="capable"></span></small></figcaption>
  </figure>
</main>
<script>
  // Same host as this page: localhost, or the server's PANDASTIC_PUBLIC_HOST when deployed.
  const ports = { basic: '__BASIC_PORT__', capable: '__CAPABLE_PORT__' }
  const host = location.hostname
  for (const [id, port] of Object.entries(ports)) {
    document.getElementById(id).src = `${location.protocol}//${host}:${port}/`
    document.querySelector(`[data-port="${id}"]`).textContent = port
  }
  function fit() {
    // Side by side on a landscape screen, stacked on a narrow one.
    const byHeight = (innerHeight - 90) / 868
    const byWidth = innerWidth > innerHeight * 0.9 ? (innerWidth - 100) / (2 * 414) : (innerWidth - 24) / 414
    document.documentElement.style.setProperty('--scale', Math.max(0.4, Math.min(1, byHeight, byWidth)).toFixed(3))
  }
  addEventListener('resize', fit)
  fit()
</script>
</body>
</html>
